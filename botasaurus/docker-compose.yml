version: '3.8'

services:
  # PostgreSQL Database for Dataforge
  postgres:
    image: postgres:15-alpine
    container_name: oneextraction-postgres
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: oneextraction_secure_2026
      POSTGRES_DB: oneextraction
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - oneextraction_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d oneextraction"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Email Validator Backend (Check-If-Email-Exists)
  email-validator:
    image: reacherhq/backend:latest
    container_name: oneextraction-email-validator
    ports:
      - "8081:8080"
    environment:
      RUST_LOG: info
    networks:
      - oneextraction_net
    depends_on:
      - postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Ollama for Local AI Enrichment (Optional)
  # Uncomment to enable local LLM-based enrichment
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: oneextraction-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   networks:
  #     - oneextraction_net
  #   restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  # ollama_data:
  #   driver: local

networks:
  oneextraction_net:
    driver: bridge
